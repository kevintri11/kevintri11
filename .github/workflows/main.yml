name: Generate Arcade Contribution Graph

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Generate Galaga Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: kevintri11
          games: 'galaga'

      - name: Update SVG files in main branch
        run: |
          cp dist/galaga-contribution-graph.svg .
          cp dist/galaga-contribution-graph-dark.svg .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add galaga-contribution-graph.svg
          git add galaga-contribution-graph-dark.svg

          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: update contribution graph"
            git pull --rebase origin main
            git push origin main
          fi
